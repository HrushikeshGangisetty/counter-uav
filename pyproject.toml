[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kft-cuav-pod"
version = "0.0.0"
description = "KFT Counter-UAV Advisory Pod --- companion-computer software"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Kept separate on purpose: the pure modules must be testable on any laptop with no
# hardware and no heavyweight dependencies [PRD 4.3].
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "types-PyYAML"]
sitl = ["pymavlink>=2.4", "MAVProxy>=1.8"]          # M2
vision = ["numpy>=1.24", "opencv-python>=4.8"]      # M2, pod_geometry
# NOTE: HailoRT, the Hailo GStreamer elements and libcamera are NOT pip
# dependencies. They are platform packages on Raspberry Pi OS Bookworm and are
# documented in docs/developer-setup.md rather than faked here.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "simulation", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ANN201", "ANN401"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pod_config", "pod_contracts", "pod_gcs", "pod_geometry", "pod_guidance", "pod_mavlink", "pod_perception", "pod_state", "simulation", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201"]
"scripts/**" = ["ANN201"]
# These functions decode untyped external data (YAML scalars, JSON records, raw
# pymavlink message objects). Any is the honest annotation at that boundary; the
# typed contract (VehicleState/RCState/...) starts immediately after it.
"src/pod_contracts/codec.py" = ["ANN401"]
"src/pod_config/loader.py" = ["ANN401"]
"src/pod_config/schema.py" = ["ANN401"]
"src/pod_perception/pipeline.py" = ["ANN401"]
"src/pod_mavlink/rx_runtime.py" = ["ANN401"]
# Decodes untyped YAML scalars into the typed CalibrationBundle; Any is the honest
# annotation at that boundary, matching src/pod_config/loader.py above.
"tools/calibration/store.py" = ["ANN401"]
# Decode untyped JSON records (dataset samples, model artifact manifests) into typed
# dataclasses; Any is the honest annotation at that boundary, same rationale as
# tools/calibration/store.py above.
"tools/ml/dataset/loader.py" = ["ANN401"]
"tools/ml/artifacts/codec.py" = ["ANN401"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "."]
packages = ["pod_contracts", "pod_config", "pod_geometry", "pod_guidance", "pod_state", "pod_mavlink", "pod_perception", "pod_gcs", "tools"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymavlink is the 'sitl' extra, not a dev dependency [README "No hardware
# required"]. Only imported lazily inside MavlinkLink.open().
module = ["pymavlink.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# picamera2 is a Raspberry Pi OS platform package, not a pip dependency
# (docs/developer-setup.md). Only imported lazily inside
# tools/camera_bench/capture.py.
module = ["picamera2.*"]
ignore_missing_imports = true
