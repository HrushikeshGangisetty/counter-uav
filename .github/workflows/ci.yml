name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check src tests simulation scripts
          python -m ruff format --check src tests simulation scripts
      - name: Type check
        run: python -m mypy
      # Run the architecture tests as their own step so a boundary violation is
      # visible in the CI summary rather than buried in the full suite
      # [PRD 2.3, 7.2].
      - name: Architecture boundaries
        run: python -m pytest tests/architecture -v
      - name: Tests
        run: python -m pytest
      - name: Fixtures are reproducible
        run: |
          python scripts/make_fixtures.py
          git diff --exit-code fixtures/
